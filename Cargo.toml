[package]
name = "rexia"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Native Linux client for Rex, built on GPUI and themed by Noctalia"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flume = "0.11"
futures-util = { version = "0.3", features = ["sink"] }
ghostty-vt = { version = "=0.8.0", features = ["png"] }
image = { version = "0.25", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland", "x11"] }
notify = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland", "x11", "test-support"] }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12" }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
debug = false

# ghostty-vt with a safe wrapper for the render state's image list; see
# vendor/ghostty-vt/README.md.
[patch.crates-io]
ghostty-vt = { path = "vendor/ghostty-vt" }
gpui-pre-linux = { path = "vendor/gpui-linux" }
